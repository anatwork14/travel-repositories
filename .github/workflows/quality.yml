name: Validate travel site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/home.js
          node --check assets/destinations.js
          node --check assets/travel-checklist.js
          node --check assets/intelligence.js
          node --check assets/guide.js
          node --check macau/data.js
          python3 -m py_compile scripts/refresh_intelligence.py
      - name: Validate static document and navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path(".")
          checks={
            "index.html": ['data-page="home"', './assets/app.js', './assets/site.css'],
            "macau/index.html": ['data-page="city"', '../assets/app.js', '../assets/site.css'],
            "macau/data.js": ["export const macau", "spots:", "foods:", "hotels:", "cautions:", "sources:"],
            "assets/app.js": ["const tabs=", "renderMap", "renderPrices", "renderRisks"],
          }
          for name, phrases in checks.items():
            content=(root/name).read_text(encoding="utf-8")
            for phrase in phrases: assert phrase in content, (name, phrase)
          import json
          for name in ["macau/intelligence.json", "macau/live-news.json", "macau/review-links.json"]:
            data=json.loads((root/name).read_text(encoding="utf-8"))
            assert isinstance(data,dict)
          app=(root/"assets/app.js").read_text(encoding="utf-8")
          for feature in ["renderInsights", "activateInsights", "renderGuide", "activateGuide"]:
            assert feature in app
          assert 'data-intel-filter' in (root/"assets/intelligence.js").read_text(encoding="utf-8")
          assert 'data-guide-export' in (root/"assets/guide.js").read_text(encoding="utf-8")
          assert 'experiences.css' in (root/"macau/index.html").read_text(encoding="utf-8")
          for fname in ["assets/home.js","assets/destinations.js","assets/travel-checklist.js","assets/home.css","docs/travel-experience-ux-research.md"]:
            assert (root/fname).is_file(), fname
          home=(root/"assets/home.js").read_text(encoding="utf-8")
          for widget in ["destination-query","destination-country","destination-province","destination-results","trip-checklist"]:
            assert widget in home or widget in (root/"assets/travel-checklist.js").read_text(encoding="utf-8"), widget
          registry=(root/"assets/destinations.js").read_text(encoding="utf-8")
          assert "country" in registry and "province" in registry and "locality" in registry
          index=(root/"index.html").read_text(encoding="utf-8")
          assert './assets/home.css' in index
          app=(root/"assets/app.js").read_text(encoding="utf-8")
          assert "renderHome()" in app and "bindHome()" in app
          print("All modules, neutral homepage, checklist and city public paths verified")
          PY
